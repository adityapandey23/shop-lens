# ===============================
# 1. SERVER CONFIGURATION
# ===============================
spring.application.name=shop-lens
application.security.jwt.secret-key=${JWT_SECRET:mysecretpassword}

# ===============================
# 2. DATABASE (PostgreSQL)
# ===============================
# Connect to localhost for dev, or AWS RDS via Env Vars later
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
# "update" automatically creates/updates tables based on your Entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# 3. QUEUE (RabbitMQ)
# ===============================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Enable JSON serialization (Linked to the Config class we discussed)
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.max-retries=3

# ===============================
# 4. CACHE (Valkey / Redis)
# ===============================
# Spring Data Redis works perfectly with Valkey
spring.data.redis.host=${VALKEY_HOST:localhost}
spring.data.redis.port=${VALKEY_PORT:6379}
spring.data.redis.password=${VALKEY_PASSWORD:}
# database index (0 is default)
spring.data.redis.database=0

## ===============================
## 5. SHOPIFY APP CONFIG
## ===============================
## The "Global" keys for your App (From Partner Dashboard)
#shopify.client.id=${SHOPIFY_CLIENT_ID}
#shopify.client.secret=${SHOPIFY_CLIENT_SECRET}
## The Base URL of your backend (needed for OAuth callbacks)
#app.base-url=${APP_BASE_URL:http://localhost:8080}
## Redirect URI for OAuth
#shopify.redirect-uri=${app.base-url}/api/auth/callback

# ===============================
# 6. LOGGING
# ===============================
logging.level.org.springframework.web=INFO
logging.level.com.xeno=DEBUG